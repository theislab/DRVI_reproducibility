[tool.poetry]
name = "drvi_notebooks"
version = "1.0.0"
description = "Reproducibility Notebooks and Utils for DRVI"
authors = ["Amir Ali moinfar <moinfar.amirali@gmail.com>"]
readme = "README.md"
packages = [{include = "drvi_notebooks"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
drvi-py = ">=0.2.4"
numpy = ">=1.22.0"
pandas = ">=1.3.0"
scipy = ">=1.7.0"
anndata = ">=0.8.0"
scanpy = ">=1.9.0"
scikit-learn = ">=1.0.0"
mofapy2 = ">=0.7.0"
pyliger = ">=0.2.4"
scETM = ">=0.5.0"
scvi-tools = ">=1.0.0"
tensorflow = ">=2.15.0"
tensorflow-probability = ">=0.23.0"
torch = ">=2.0.0"
joblib = ">=1.3.0"
h5py = ">=3.9.0"
pyyaml = ">=6.0.0"
pyarrow = ">=10.0.0"
wandb = ">=0.15.12"
tensorboard = ">=2.15.0"
leidenalg = ">=0.10.1"
# rapids_singlecell = ">=0.9.3,<1.0.0"
xgboost = ">=2.0.0"
gprofiler-official = ">=1.0.0"
scib-metrics = ">=0.5.0"
mplscience = ">=0.0.7"

[tool.poetry.group.dev.dependencies]
black = ">=23.10.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
